server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The control service must be wired explicitly at the outer reverse proxy.
    # Do not return index.html with HTTP 200 for a missing API deployment.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"message":"Dịch vụ thiết lập doanh nghiệp chưa được cấu hình."}';
    }

    location = /healthz {
        include /etc/nginx/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker and app shell must be revalidated after every deploy;
    # otherwise a stale build can keep calling an obsolete Supabase endpoint.
    location = /sw.js {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
        default_type application/manifest+json;
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # React Router needs the entry document for client-side routes.
    location / {
        include /etc/nginx/security-headers.conf;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        try_files $uri $uri/ /index.html;
    }
}
