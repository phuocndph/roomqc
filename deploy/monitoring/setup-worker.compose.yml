{
  "name":"${ROOMQC_SETUP_PROJECT:?owned setup worker project required}",
  "services":{
    "setup-worker":{
      "profiles":["setup-worker"],
      "image":"${ROOMQC_SETUP_IMAGE:?reviewed immutable control worker image required}",
      "command":["node","workers/setup-runtime.mjs"],
      "working_dir":"/app",
      "user":"1000:1000","read_only":true,"cap_drop":["ALL"],"security_opt":["no-new-privileges:true"],
      "init":true,"restart":"unless-stopped","stop_grace_period":"25s",
      "environment":{"NODE_ENV":"production","ROOMQC_RESOURCE_ENVIRONMENT":"${ROOMQC_RESOURCE_ENVIRONMENT:-production}",
        "ROOMQC_RESOURCE_BUDGET_FILE":"/etc/roomqc/resource-budget.json","ROOMQC_SETUP_CONFIG_FILE":"/etc/roomqc/setup.json",
        "ROOMQC_SETUP_DATABASE_URL_FILE":"/run/secrets/setup-dsn","ROOMQC_SETUP_RELEASE_TRUST_FILE":"/etc/roomqc/setup-trust.json"},
      "volumes":[
        {"type":"bind","source":"${ROOMQC_SETUP_CONFIG_FILE:?reviewed setup metadata required}","target":"/etc/roomqc/setup.json","read_only":true,"bind":{"create_host_path":false}},
        {"type":"bind","source":"${ROOMQC_RESOURCE_BUDGET_FILE:?reviewed shared resource metadata required}","target":"/etc/roomqc/resource-budget.json","read_only":true,"bind":{"create_host_path":false}},
        {"type":"bind","source":"${ROOMQC_SETUP_RELEASE_TRUST_FILE:?reviewed public release trust file required}","target":"/etc/roomqc/setup-trust.json","read_only":true,"bind":{"create_host_path":false}},
        {"type":"bind","source":"${ROOMQC_SETUP_CREDENTIALS_DIR:?dedicated scoped credential directory required}","target":"/run/roomqc/setup","read_only":true,"bind":{"create_host_path":false}}
      ],
      "secrets":["setup-dsn"],"tmpfs":["/tmp:rw,nosuid,noexec,size=8m"],"networks":["directory","egress"],
      "mem_limit":"256m","cpus":"0.5","pids_limit":64,
      "labels":{"roomqc.setup-worker":"${ROOMQC_SETUP_PROJECT:?owned setup worker project required}"},
      "logging":{"driver":"json-file","options":{"max-size":"10m","max-file":"3"}},
      "healthcheck":{"test":["CMD","node","-e","fetch('http://127.0.0.1:8095/readyz',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"],
        "interval":"30s","timeout":"3s","retries":3,"start_period":"30s"}
    }
  },
  "secrets":{"setup-dsn":{"file":"${ROOMQC_SETUP_DATABASE_URL_FILE:?dedicated restricted setup DSN file required}"}},
  "networks":{"directory":{"external":true,"name":"${ROOMQC_SETUP_DIRECTORY_NETWORK:?approved directory network required}"},
    "egress":{"external":true,"name":"${ROOMQC_SETUP_EGRESS_NETWORK:?approved outbound network required}"}}
}
