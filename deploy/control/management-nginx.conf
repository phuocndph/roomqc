server {
    listen 8080;
    server_name _;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $roomqc_control_upstream roomqc-control:8091;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { include /etc/nginx/security-headers.conf; access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/control/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://$roomqc_control_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
        add_header Cache-Control "no-store" always;
    }
    location /api/ { include /etc/nginx/security-headers.conf; default_type application/json; return 503 '{"code":"API_NOT_CONFIGURED"}'; }
    location /assets/ { include /etc/nginx/security-headers.conf; try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location / { include /etc/nginx/security-headers.conf; try_files $uri $uri/ /index.html; add_header Cache-Control "no-store" always; }
}
