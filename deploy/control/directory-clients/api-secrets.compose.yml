# Keep the API's DSN out of its environment and expose only its own secret file.
services:
  roomqc-control:
    environment:
      ROOMQC_CONTROL_DATABASE_URL: ""
      ROOMQC_CONTROL_DATABASE_URL_FILE: /run/secrets/control-dsn
    secrets: [control-dsn]
secrets:
  control-dsn:
    file: ${ROOMQC_CONTROL_DATABASE_URL_FILE:?dedicated API runtime DSN file required}
