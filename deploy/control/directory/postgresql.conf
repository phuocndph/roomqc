listen_addresses = '*'
port = 5432
ssl = on
ssl_min_protocol_version = 'TLSv1.2'
ssl_cert_file = '/run/roomqc-directory-private/server.crt'
ssl_key_file = '/run/roomqc-directory-private/server.key'
password_encryption = 'scram-sha-256'
unix_socket_directories = '/var/run/postgresql'
log_statement = 'none'
log_connections = off
log_disconnections = off
log_min_error_statement = panic
log_line_prefix = '%m [%p] '
