# Socket access is limited to the matching OS identity inside this DB container.
local   all              all                              peer
# No cleartext network authentication, even with a valid password.
hostnossl all            all              0.0.0.0/0        reject
hostnossl all            all              ::/0             reject
# Network is an isolated, owned Docker network; clients still verify CA + name.
hostssl roomqc_control   all              0.0.0.0/0        scram-sha-256
hostssl roomqc_control   all              ::/0             scram-sha-256
