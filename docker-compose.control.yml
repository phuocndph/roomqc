# Explicit opt-in; does not change the existing frontend/backend automatically.
services:
  roomqc-control:
    build:
      context: .
      dockerfile: server/control/Dockerfile
    env_file: .env.control
    environment:
      ROOMQC_CONTROL_HOST: 0.0.0.0
      ROOMQC_CONTROL_PORT: 8091
      ROOMQC_RESOURCE_ENVIRONMENT: ${ROOMQC_RESOURCE_ENVIRONMENT:-production}
      ROOMQC_RESOURCE_BUDGET_FILE: /etc/roomqc/resource-budget.json
      # Host-side migration CLI reads its own credential; the API never receives it.
      ROOMQC_CONTROL_MIGRATION_DATABASE_URL: ""
    volumes:
      - type: bind
        source: ${ROOMQC_RESOURCE_BUDGET_FILE:?reviewed shared resource metadata required}
        target: /etc/roomqc/resource-budget.json
        read_only: true
        bind: { create_host_path: false }
    ports:
      - "127.0.0.1:${ROOMQC_CONTROL_HOST_PORT:-8091}:8091"
    restart: unless-stopped
    init: true
    stop_grace_period: 70s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/control/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
