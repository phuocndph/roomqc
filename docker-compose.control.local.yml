# Standalone local directory. Credentials generated by scripts/control-local.mjs.
# This file never starts or migrates the existing Supabase/CRM databases.
name: roomqc-control-local
services:
  directory:
    image: postgres:16-alpine@sha256:b7587f3cb74f4f4b2a4f9d67f052edbf95eb93f4fec7c5ada3792546caaf7383
    env_file: .local/control/db.env.local
    volumes:
      - directory-data:/var/lib/postgresql/data
    networks: [directory]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d roomqc_control"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels: { roomqc.control-local: "v3" }
  roomqc-control:
    image: roomqc-control:foundation-v3
    build:
      context: .
      dockerfile: server/control/Dockerfile
    env_file: .local/control/api.env.local
    networks: [directory,access]
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:8091:8091"]
    depends_on:
      directory: { condition: service_healthy }
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8091/api/control/readyz',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *logging
    labels: { roomqc.control-local: "v3" }
networks:
  directory:
    internal: true
    labels: { roomqc.control-local: "v3" }
  access:
    name: roomqc-control-access-local
    labels: { roomqc.control-local: "v3" }
volumes:
  directory-data:
    labels: { roomqc.control-local: "v3" }
