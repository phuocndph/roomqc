# This is the namespace used by the existing local Docker stack. It keeps
# `supabase status` attached to the current volume instead of creating a new DB.
# Production projects are selected explicitly with `supabase link --project-ref <ref>`.
project_id = "ehjtoajnlnuvuiwkpmbp"

[auth]
site_url = "http://127.0.0.1:8082"
additional_redirect_urls = ["http://127.0.0.1:8082/**", "http://localhost:8082/**", "com.roomqc.app://auth/callback", "com.roomqc.app://auth/change-password", "com.roomqc.app://auth/callback?**", "com.roomqc.app://auth/change-password?**"]

[auth.email]
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1m"
otp_expiry = 600
otp_length = 6

[auth.email.template.confirmation]
subject = "RoomQC — Xác minh tài khoản"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "RoomQC — Mã khôi phục tài khoản"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.invite]
subject = "RoomQC — Lời mời tham gia khách sạn"
content_path = "./supabase/templates/invite.html"

[functions]
  [functions.auth-email-hook]
    verify_jwt = false
  [functions.check-subscription-status]
