# Use with docker-compose.roomqc.yml. Reuses the current frontend image.
# Only nginx configuration is mounted; directory/signup frontend flags stay explicit.
services:
  roomqc:
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx-control.local.conf:/etc/nginx/roomqc-control.d/local.conf:ro
    networks: [default,control-access]
networks:
  control-access:
    name: roomqc-control-access-local
    external: true
